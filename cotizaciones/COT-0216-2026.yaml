# Nota al pie de la propuesta económica (nivel raíz, no dentro de opciones)
opciones_nota: >
  Ambas opciones incluyen combustible, conductor, peajes, seguros SOAP y RC,
  permisos, acreditación SERNAGEOMIN y coordinación operacional. Sin costos
  adicionales dentro del alcance definido.

condiciones:
  pago:
    - clave: "Moneda"
      valor: "Pesos Chilenos (CLP) netos"
    - clave: "Garantía inicio"
      valor: "50% del valor mensual a la firma del contrato — reserva conductor y vehículo"
    - clave: "Facturación"
      valor: "El día 1° de cada mes por el mes en curso"
    - clave: "Plazo de pago"
      valor: "7 días hábiles desde la emisión de la factura"
    - clave: "Mora"
      valor: "Interés máximo convencional (Ley N° 18.010) desde el primer día de atraso"
    - clave: "Suspensión"
      valor: "+10 días de atraso habilita a Hauler a suspender el servicio sin penalidad"
    - clave: "Reajuste"
      valor: "Trimestral según IPC + precio bencina 93 ENAP Antofagasta"
    - clave: "Vigencia oferta"
      valor: "30 días corridos desde la fecha de emisión"
  operacion:
    - clave: "Dotación máxima"
      valor: "14 personas/turno. Incrementos requieren cotización adicional"
    - clave: "Solo personal"
      valor: "El vehículo no traslada materiales, herramientas ni equipos de volumen"
    - clave: "Acreditación"
      valor: "5–15 días hábiles. Inicio del servicio condicionado a su aprobación. Hauler gestiona el proceso desde la firma"
    - clave: "Rotación"
      valor: "Incluida en ambas opciones. Art. 25 Cód. del Trabajo sin costo adicional"
    - clave: "Fuerza mayor"
      valor: "Corte de ruta o emergencia vial sin penalidad para ninguna de las partes"
    - clave: "Modificaciones"
      valor: "Cambios de jornada, ruta o dotación por addendum al contrato"
    - clave: "Contrato"
      valor: "Hauler emite contrato conforme a D.S. N° 80 MTT. Obligaciones laborales exclusivas de Hauler — sin solidaridad para el cliente"
  # El prefijo "Protección para <razón social>:" se antepone automáticamente.
  texto_callout: >
    Hauler SpA asume la responsabilidad total del servicio, incluyendo
    obligaciones laborales, previsionales y de seguridad del conductor. El
    cliente solo paga la factura mensual. Sin complicaciones operacionales,
    sin gestión de personal de transporte, sin imprevistos.

firma:
  texto_cierre: >
    Hauler SpA tiene la flota, los conductores acreditados y la experiencia
    operacional para garantizar que el personal de Soluciones Mineras SpA llegue
    a Mantos Blancos puntual y seguro — sin que el cliente deba gestionar ningún
    aspecto del transporte.
  nota_contacto: >
    Para confirmar la propuesta, seleccionar una opción o solicitar una reunión,
    contáctenos directamente al correo o teléfono indicados. La oferta tiene
    vigencia de 30 días corridos.
  texto_legal: >
    Al firmar esta propuesta, Soluciones Mineras SpA confirma la aceptación de
    las condiciones comerciales y operacionales descritas bajo la cotización
    COT-0216-2026 emitida por Hauler SpA.
