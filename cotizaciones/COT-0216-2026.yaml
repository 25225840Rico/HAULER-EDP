# Nota al pie de la propuesta económica (nivel raíz, no dentro de opciones)
opciones_nota: >
  Ambas opciones incluyen combustible, conductor, peajes, seguros SOAP y RC,
  permisos, acreditación SERNAGEOMIN y coordinación operacional. Sin costos
  adicionales dentro del alcance definido.

condiciones:
  pago:
    - clave: "Moneda"
      valor: "Pesos Chilenos (CLP) netos"
    - clave: "Garantía inicio"
      valor: "50% del valor mensual a la firma del contrato"
    - clave: "Facturación"
      valor: "Mensual, contra estado de pago aprobado"
    - clave: "Reajuste"
      valor: "Sin reajuste dentro de la vigencia del contrato"
    - clave: "Vigencia oferta"
      valor: "30 días corridos desde la fecha de emisión"
  operacion:
    - clave: "Dotación máxima"
      valor: "14 personas/turno. Incrementos requieren cotización adicional"
    - clave: "Punto de embarque"
      valor: "Único en Antofagasta, a coordinar antes del inicio"
    - clave: "Respaldo"
      valor: "Vehículo y conductor suplente disponibles desde Antofagasta"
    - clave: "Contingencias"
      valor: "Protocolo ante cortes de ruta sin penalidad para las partes"
